name: Android

# The arm64 APK. Run by hand (Actions tab, "Run workflow") for a test build,
# downloaded from the run's artifacts; release.yml calls it for every tag and
# attaches the APK to the draft release.
#
# Signing: repository secrets ANDROID_KEYSTORE (the .jks, base64),
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. Without them a throwaway
# key is made: the APK installs, but can't update one signed with the real key.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # The runner has the SDK and NDK; Tauri finds the NDK through NDK_HOME.
      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # gen/android is not committed (yet): generate it fresh, with icons.
      - name: Android project
        run: |
          npm ci
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
          # The wrapper gives up on its Gradle download after 10 s by default.
          wrapper=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/^networkTimeout=/d' "$wrapper"
          printf '\nnetworkTimeout=120000\n' >> "$wrapper"

      - name: Build
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a throwaway key."
            KEYSTORE_PASSWORD=throwaway KEY_ALIAS=orthros
            keytool -genkeypair -keystore release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Orthros test build"
          fi
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n1)"
          test -n "$unsigned"
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          mkdir -p out
          "$tools/zipalign" -p -f 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "out/Orthros_${version}_arm64.apk" aligned.apk
          "$tools/apksigner" verify "out/Orthros_${version}_arm64.apk"
          rm release.jks

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
