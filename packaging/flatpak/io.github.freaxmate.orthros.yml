# Flatpak bundle, built by the release workflow from the .deb it just made
# (saved here as orthros.deb) and flathub/shared-modules (cloned here).
id: io.github.freaxmate.orthros
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: orthros
# Some shared modules install into /app/lib64 with newer CMake.
build-options:
  prepend-pkg-config-path: /app/lib64/pkgconfig
  prepend-ld-library-path: /app/lib64
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: orthros
    buildsystem: simple
    sources:
      - type: file
        path: orthros.deb
      - type: file
        path: io.github.freaxmate.orthros.metainfo.xml
    build-commands:
      - ar -x orthros.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/orthros /app/bin/orthros
      # The tray libraries, where the dynamic loader looks at runtime.
      - if [ -d /app/lib64 ]; then cp -a /app/lib64/. /app/lib/; fi
      - install -Dm644 usr/share/applications/Orthros.desktop /app/share/applications/io.github.freaxmate.orthros.desktop
      - desktop-file-edit --set-icon=io.github.freaxmate.orthros /app/share/applications/io.github.freaxmate.orthros.desktop
      - |
        for png in usr/share/icons/hicolor/*/apps/orthros.png; do
          size="$(basename "$(dirname "$(dirname "$png")")")"
          install -Dm644 "$png" "/app/share/icons/hicolor/$size/apps/io.github.freaxmate.orthros.png"
        done
      - install -Dm644 io.github.freaxmate.orthros.metainfo.xml /app/share/metainfo/io.github.freaxmate.orthros.metainfo.xml
