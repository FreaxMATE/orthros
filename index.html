<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Orthros</title>
  </head>
  <body>
    <header class="top" data-tauri-drag-region>
      <nav class="tabs" aria-label="Views">
        <button type="button" data-view="today" aria-current="page">Today</button>
        <button type="button" data-view="notes">Notes</button>
        <button type="button" data-view="map">Map</button>
        <button type="button" data-view="days" class="desktop-only">Days</button>
        <button type="button" data-view="search">Search</button>
      </nav>
      <div class="top-right">
        <div class="sync-wrap">
          <button type="button" class="sync" id="sync" data-state="off" aria-haspopup="dialog" aria-expanded="false">
            <span class="sync-dot" aria-hidden="true"></span><span id="sync-text"></span>
          </button>
        </div>
        <button type="button" class="theme-switch" id="theme-switch">system</button>
      </div>
    </header>

    <main>
      <section id="view-today" class="view" aria-label="Days"></section>

      <section id="view-notes" class="view" aria-label="Notes" hidden>
        <div id="notes-index">
          <h1 class="day-title">Notes</h1>
          <ul id="notes-list" class="plain-list notes-list"></ul>
        </div>
        <div id="note-later" class="day" hidden>
          <button type="button" class="back">← Notes</button>
          <div class="day-meta">not today, not forgotten</div>
          <h1 class="day-title">Later</h1>
          <div id="later-editor" class="doc"></div>
        </div>
        <div id="note-other" class="day" hidden>
          <button type="button" class="back">← Notes</button>
          <div id="note-editor" class="doc"></div>
        </div>
      </section>

      <section id="view-map" class="view" aria-label="Map" hidden>
        <h1 class="day-title">Map</h1>
        <div id="map"></div>
      </section>

      <section id="view-days" class="view" aria-label="All days" hidden>
        <h1 class="day-title">Days</h1>
        <ul id="days-list" class="plain-list"></ul>
      </section>

      <section id="view-search" class="view" aria-label="Search" hidden>
        <label class="search-box">
          <span class="visually-hidden">Search all days and Later</span>
          <input id="search-input" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
        </label>
        <ul id="search-results" class="plain-list"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
